<!DOCTYPE html>
<html>
<head>
  <title>Peta Gunung di Jawa Barat</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    :root {
      --orange: #ff9a00;
      --orange-light: #ffbf5f;
      --orange-dark: #9a4f00;
      --dark: #120b05;
      --dark-soft: #20120a;
      --white-soft: #f8fafc;
      --text-muted: #d7dce3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 5%, rgba(255, 154, 0, 0.40), transparent 34%),
        linear-gradient(135deg, #1a0f07 0%, #120b05 45%, #050505 100%);
      color: var(--white-soft);
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      padding: 18px 22px;
      background: rgba(20, 13, 8, 0.72);
      border: 1px solid rgba(255, 154, 0, 0.28);
      border-radius: 24px;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.38);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--orange), var(--orange-light));
      color: #2b1500;
      font-size: 27px;
      box-shadow: 0 12px 30px rgba(255, 154, 0, 0.35);
    }

    .brand h1 {
      font-size: 26px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand p {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .status {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 154, 0, 0.15);
      border: 1px solid rgba(255, 154, 0, 0.45);
      color: var(--orange-light);
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(255, 154, 0, 0.15);
    }

    .dashboard {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 22px;
      min-height: 78vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      background: rgba(24, 15, 9, 0.72);
      border: 1px solid rgba(255, 154, 0, 0.22);
      border-radius: 24px;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.34);
      padding: 20px;
    }

    .panel-title {
      font-size: 15px;
      color: var(--orange);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .stat-card {
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255, 154, 0, 0.18), rgba(255,255,255,0.05));
      border: 1px solid rgba(255, 154, 0, 0.20);
    }

    .stat-card h2 {
      font-size: 28px;
      color: var(--orange);
      margin-bottom: 4px;
    }

    .stat-card p {
      font-size: 13px;
      color: #f3f4f6;
    }

    .mountain-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: 430px;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 4px;
}

    .mountain-list::-webkit-scrollbar {
      width: 6px;
    }

    .mountain-list::-webkit-scrollbar-thumb {
      background: rgba(255, 154, 0, 0.65);
      border-radius: 10px;
    }

    .mountain-item {
  cursor: pointer;
  padding: 13px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  transition: 0.25s ease;
  width: 100%;
  min-width: 0;
}

    .mountain-item:hover {
      transform: translateX(5px);
      background: rgba(255, 154, 0, 0.16);
      border-color: rgba(255, 154, 0, 0.50);
    }

    .mountain-item h4 {
      font-size: 14px;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .mountain-item span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .map-card {
      position: relative;
      height: 78vh;
      min-height: 500px;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 154, 0, 0.28);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
      background: #ffffff;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .lux-marker {
      width: 46px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.35));
      animation: markerFloat 2s ease-in-out infinite;
    }

    .lux-marker svg {
      width: 46px;
      height: 58px;
    }

    @keyframes markerFloat {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }

    .leaflet-popup-content-wrapper {
      border-radius: 20px;
      padding: 4px;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(0,0,0,0.4);
    }

    .leaflet-popup-content {
      margin: 14px 16px;
    }

    .popup-box {
      min-width: 240px;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .popup-title {
      font-size: 18px;
      font-weight: 800;
      color: #2b1500;
      margin-bottom: 8px;
    }

    .popup-content {
      color: #334155;
      font-size: 14px;
      line-height: 1.6;
    }

    .popup-label {
      font-weight: 700;
      color: #0f172a;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 11px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }

    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35) !important;
    }

    .leaflet-control-zoom a {
      background: rgba(18, 11, 5, 0.92) !important;
      color: var(--orange-light) !important;
      border: 1px solid rgba(255,154,0,0.22) !important;
    }

    @media (max-width: 980px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .map-card,
      #map {
        height: 70vh;
        min-height: 70vh;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 14px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .logo {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="logo">⛰️</div>
        <div>
          <h1>Peta Gunung Jawa Barat</h1>
          <p>Visualisasi interaktif lokasi, ketinggian, dan wilayah administratif gunung utama</p>
        </div>
      </div>

      <div class="status">● Interactive Mountain Map by piantsa
      </div>
      
    </div>

    <div class="dashboard">
      <div class="sidebar">
        <div class="panel">
          <div class="panel-title">Ringkasan Data</div>
          <div class="stats-grid">
            <div class="stat-card">
              <h2>10</h2>
              <p>Jumlah gunung yang ditampilkan</p>
            </div>
            <div class="stat-card">
              <h2>3.078</h2>
              <p>Mdpl tertinggi: Gunung Ciremai</p>
            </div>
            <div class="stat-card">
              <h2>Jabar</h2>
              <p>Fokus wilayah pemetaan</p>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Daftar Gunung</div>
          <div class="mountain-list" id="mountainList"></div>
        </div>
      </div>

      <div class="map-card">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    var batasJawaBarat = [
      [-7.90, 106.30],
      [-5.80, 108.90]
    ];

    var map = L.map('map', {
      maxBounds: batasJawaBarat,
      maxBoundsViscosity: 1.0,
      minZoom: 8,
      maxZoom: 14,
      zoomControl: true
    }).setView([-6.95, 107.70], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var iconGunung = L.divIcon({
      html: `
        <div class="lux-marker">
          <svg viewBox="0 0 64 82" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 2C18.2 2 7 13.2 7 27c0 18.8 25 53 25 53s25-34.2 25-53C57 13.2 45.8 2 32 2Z" fill="#2b1500" stroke="#ff9a00" stroke-width="4"/>
            <circle cx="32" cy="28" r="19" fill="#ffffff"/>
            <path d="M16 42L29 20L36 32L41 25L50 42H16Z" fill="#ff9a00"/>
            <path d="M29 20L33 27L26 27Z" fill="#ffffff"/>
            <path d="M41 25L44 31L38 31Z" fill="#ffffff"/>
          </svg>
        </div>
      `,
      className: "",
      iconSize: [46, 58],
      iconAnchor: [23, 58],
      popupAnchor: [0, -58]
    });

    var dataGunung = [
      { nama: "Gunung Ciremai", lokasi: "Majalengka & Kuningan", mdpl: "3.078 mdpl", keterangan: "Gunung tertinggi di Jawa Barat.", lat: -6.892, lng: 108.407 },
      { nama: "Gunung Pangrango", lokasi: "Cianjur & Sukabumi", mdpl: "3.019 mdpl", keterangan: "Salah satu gunung utama di kawasan Gede-Pangrango.", lat: -6.770, lng: 106.965 },
      { nama: "Gunung Gede", lokasi: "Cianjur, Sukabumi & Bogor", mdpl: "2.958 mdpl", keterangan: "Berada di kawasan Taman Nasional Gunung Gede Pangrango.", lat: -6.786, lng: 106.982 },
      { nama: "Gunung Cikuray", lokasi: "Garut", mdpl: "2.821 mdpl", keterangan: "Terkenal dengan pemandangan lautan awan.", lat: -7.322, lng: 107.860 },
      { nama: "Gunung Papandayan", lokasi: "Garut", mdpl: "2.665 mdpl", keterangan: "Ramah untuk pemula, terkenal dengan kawah dan hutan mati.", lat: -7.319, lng: 107.731 },
      { nama: "Gunung Salak", lokasi: "Sukabumi & Bogor", mdpl: "2.211 mdpl", keterangan: "Gunung vulkanik di wilayah Bogor dan Sukabumi.", lat: -6.716, lng: 106.733 },
      { nama: "Gunung Galunggung", lokasi: "Tasikmalaya", mdpl: "2.167 mdpl", keterangan: "Terkenal dengan danau kawah dan tangga permanen.", lat: -7.255, lng: 108.058 },
      { nama: "Gunung Tangkuban Parahu", lokasi: "Bandung Barat & Subang", mdpl: "2.084 mdpl", keterangan: "Gunung wisata populer dengan kawah besar.", lat: -6.759, lng: 107.609 },
      { nama: "Gunung Burangrang", lokasi: "Bandung Barat", mdpl: "2.064 mdpl", keterangan: "Gunung di kawasan Bandung Barat.", lat: -6.760, lng: 107.562 },
      { nama: "Gunung Patuha", lokasi: "Bandung", mdpl: "2.434 mdpl", keterangan: "Lokasi kawasan wisata Kawah Putih.", lat: -7.166, lng: 107.400 }
    ];

    var markerGunung = [];
    var list = document.getElementById("mountainList");

    dataGunung.forEach(function(gunung) {
      var popupContent =
        "<div class='popup-box'>" +
          "<div class='popup-title'>" + gunung.nama + "</div>" +
          "<div class='popup-content'>" +
            "<span class='popup-label'>Lokasi:</span> " + gunung.lokasi + "<br>" +
            "<span class='popup-label'>Ketinggian:</span> " + gunung.mdpl + "<br>" +
            "<span class='popup-label'>Keterangan:</span> " + gunung.keterangan + "<br>" +
            "<span class='badge'>Gunung Jawa Barat</span>" +
          "</div>" +
        "</div>";

      var marker = L.marker([gunung.lat, gunung.lng], { icon: iconGunung })
        .addTo(map)
        .bindPopup(popupContent);

      markerGunung.push(marker);

      var item = document.createElement("div");
      item.className = "mountain-item";
      item.innerHTML =
        "<h4>" + gunung.nama + "</h4>" +
        "<span>" + gunung.lokasi + " • " + gunung.mdpl + "</span>";

      item.onclick = function() {
        document.querySelector(".map-card").scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

        map.flyTo([gunung.lat, gunung.lng], 11, { duration: 1.2 });

        setTimeout(function() {
          marker.openPopup();
        }, 1200);
      };

      list.appendChild(item);
    });
  </script>
</body>
</html>
