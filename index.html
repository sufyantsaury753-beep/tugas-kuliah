<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="style.css">
<style>
/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f2f5;
    color: #333;
    -webkit-overflow-scrolling: touch; /* biar smooth scroll di iOS */
}
  
/* Navbar */
header {
  background: #1e1e2f;
  color: white;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-logo {
  font-size: 1.5rem;
  font-weight: bold;
  letter-spacing: 1px;
}

.nav-links {
  display: flex;
  gap: 20px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 5px;
  transition: 0.3s;
}

.nav-links a:hover,
.nav-links a.active-page {
  background: #ffffff;
  color: #1e1e2f;
}

/* Hamburger menu for mobile */
.menu-toggle {
  display: none;
  flex-direction: column;
  cursor: pointer;
  gap: 5px;
}

.menu-toggle div {
  width: 25px;
  height: 3px;
  background: white;
}

/* Main */
main {
  max-width: 1000px;
  margin: 50px auto;
  text-align: center;
}

main h1 {
  font-size: 2.5rem;
  margin-bottom: 15px;
  color: #1e1e2f;
}

main p {
  font-size: 1.1rem;
  margin-bottom: 40px;
}

/* Cards */
.cards {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
}

.card {
  text-decoration: none;
  color: #333;
  background: white;
  padding: 25px;
  width: 280px;
  border-radius: 15px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  transition: 0.4s;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 15px 25px rgba(0,0,0,0.2);
}

.card h2 {
  margin-bottom: 10px;
  color: #1e1e2f;
}

.card p {
  font-size: 0.95rem;
  color: #555;
}

/* Footer */
footer {
  text-align: center;
  padding: 20px;
  background: #e0e0e0;
  margin-top: 50px;
  font-size: 0.9rem;
}

/* Responsive */
@media screen and (max-width: 768px) {
  .nav-links {
    display: none;
    flex-direction: column;
    background: #1e1e2f;
    position: absolute;
    top: 60px;
    right: 0;
    width: 200px;
    border-radius: 5px;
    padding: 10px 0;
  }

  .nav-links a {
    display: block;
    margin: 5px 20px;
  }

  .menu-toggle {
    display: flex;
  }

  .nav-links.active {
    display: flex;
  }
}

  @media screen and (max-width: 768px) {
  .nav-links {
    display: none;
    flex-direction: column;
    background: #1e1e2f;
    position: fixed; /* ganti dari absolute ke fixed */
    top: 60px;
    right: 0;
    width: 200px;
    border-radius: 5px;
    padding: 10px 0;
    z-index: 999;
  }
}

@media screen and (max-width: 768px) {
  .nav-links {
    display: none;
    flex-direction: column;
    position: fixed; /* jangan absolute */
    top: 60px;
    right: 0;
    width: 200px;
    background: #1e1e2f;
    z-index: 999;
  }
  .nav-links.active {
    display: flex;
  }
  .menu-toggle {
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
  }
  .menu-toggle div {
    width: 25px;
    height: 3px;
    background: white;
  }
}
  
</style>
</head>
<body>
<header>
  <div class="nav-logo"> Website </div>
  <div class="menu-toggle" onclick="toggleMenu()">
  <div></div>
  <div></div>
  <div></div>
</div>
  <nav class="nav-links">
    <a href="index.html" class="active-page">Home</a>
    <a href="gesture.html">Tes Efek Gesture</a>
    <a href="tugas.html">Tugas</a>
  </nav>
</header>

<main>
  <h1>Selamat Datang di Website Saya</h1>
  <p>Pilih menu di atas untuk Tes Gesture atau melihat Tugas Kuliah.</p>

  <div class="cards">
    <a href="gesture.html" class="card">
      <h2>Gesture</h2>
      <p>Lihat dan tes efek gesture tangan.</p>
    </a>
    <a href="tugas.html" class="card">
      <h2>Tugas</h2>
      <p>Akses semua tugas kuliah yang sudah diunggah.</p>
    </a>
  </div>
</main>

<footer>
  2026 Arsip Tugas - All Rights Reserved
</footer>

<script>
function toggleMenu() {
  document.querySelector('.nav-links').classList.toggle('active');
}
</script>
</body>
</html>
