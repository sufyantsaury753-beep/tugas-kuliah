<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="style.css">
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: #f5f7fa;
    color: #333;
}

header {
    background: #4a90e2;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
}

header .nav-logo {
    font-size: 1.5rem;
    font-weight: bold;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 20px;
}

nav ul li a {
    text-decoration: none;
    color: white;
    padding: 8px 12px;
    border-radius: 5px;
    transition: 0.3s;
}

nav ul li a:hover,
nav ul li a.active-page {
    background: white;
    color: #4a90e2;
}

main {
    max-width: 900px;
    margin: 40px auto;
    text-align: center;
}

main h1 {
    font-size: 2.2rem;
    margin-bottom: 20px;
}

.cards {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 30px;
    flex-wrap: wrap;
}

.card {
    text-decoration: none;
    color: #333;
    background: white;
    padding: 20px;
    width: 250px;
    border-radius: 10px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 18px rgba(0,0,0,0.15);
}

footer {
    text-align: center;
    padding: 15px;
    background: #eaeaea;
    margin-top: 50px;
    font-size: 0.9rem;
}
 </style> 
</head>
<body>
  <header>
    <div class="nav-logo"> Website</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="gesture.html"> Tes Efek Gesture</a></li>
        <li><a href="tugas.html">Tugas</a></li>
      </ul>
    </nav>

  </header>

  <main>
    <h1>Selamat Datang di website saya</h1>
    <p>Pilih menu di atas untuk Tes Gesture atau melihat Tugas Kuliah.</p>

    <div class="cards">
      <a href="gesture.html" class="card">
        <h2>Gesture</h2>
        <p>Tes dan lihat efek gesture tangan.</p>
      </a>
      <a href="tugas.html" class="card">
        <h2>Tugas</h2>
        <p>Akses semua tugas kuliah yang sudah diunggah.</p>
      </a>
    </div>
  </main>

  <footer>
    2026 Arsip Tugas - All Rights Reserved
  </footer>
</body>
</html>
